name: R1-F4 G0 SOURCE-ONLY first P1 copy phase feasibility, zero new ROMs
on:
  push:
    branches: [rom-dev/v018-r1-f4-early-copy-phase-20261116]
    paths: [.github/workflows/v018-r1-f4-g0-source.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  source-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Source-only phase feasibility (NO DASM or Stella or new ROM)
        run: |
          cd rom/v018/experiments/r1_free_xy
          /usr/bin/python3 r1_f4_source_preflight.py
          python3 - <<'PY'
          import json
          p=json.load(open('r1_f4_source_preflight.json'))
          assert p['F4_G0']=='SOURCE_ONLY_FEASIBLE_C18_AND_C21_NOT_STELLA'
          assert len(p['source_rows'])==9
          print('F4_G0_SOURCE_ONLY_REPRODUCIBLE_PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r1-f4-g0-source-only-no-stella-no-dasm
          path: rom/v018/experiments/r1_free_xy/r1_f4_source_preflight.json
          if-no-files-found: ignore
