name: R1-F1 targeted six-mask timing forensics
on:
  push:
    branches:
      - rom-dev/v018-r1-f1-sixmask-forensics-20261116
    paths:
      - .github/workflows/v018-r1-f1-forensics.yml
      - rom/v018/experiments/r1_free_xy/r1_f1_trace.sh
  workflow_dispatch:
permissions:
  contents: read
jobs:
  targeted-traps:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - name: Install real DASM and Stella Debugger
        run: |
          sudo apt-get update
          sudo apt-get install -y dasm stella xvfb xdotool imagemagick python3-pil
          dpkg-query -W -f='${binary:Package} ${Version}\n' dasm stella python3-pil > r1_f1_versions.txt
      - name: Byte-identical rebuild from frozen R1 sources, without alterations
        run: |
          cd rom/v018/experiments/r1_free_xy
          /usr/bin/python3 build_scaling.py
          /usr/bin/python3 build_six_sweep.py
          printf '%s  %s\n' \
            5368d88474187604284c8348054dc6f68cdaeec8492a2ad0d5cd659e4e48a506 dist/r1_individual_5_F6.bin \
            36e588b7211be9dfe6afc534117823f6540aa6d3b753c2816a22c5828d0b60b4 dist/r1_individual_6B_F6.bin \
            c9c71fb9c41cee3d1c5bb4839c7d4bbea759151e4e49510b98d4ed3ad2f03c58 dist/r1_individual_6C_F6.bin > r1_f1_expected_sha256.txt
          sha256sum -c r1_f1_expected_sha256.txt
      - name: Capture single-band Stella 6B 6C N5 register writes
        run: bash rom/v018/experiments/r1_free_xy/r1_f1_trace.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r1-f1-real-stella-6b-6c-n5-traps
          path: |
            r1_f1_versions.txt
            rom/v018/experiments/r1_free_xy/r1_f1_expected_sha256.txt
            rom/v018/experiments/r1_free_xy/dist/r1_individual_5.lst
            rom/v018/experiments/r1_free_xy/dist/r1_individual_6B.lst
            rom/v018/experiments/r1_free_xy/dist/r1_individual_6C.lst
            rom/v018/experiments/r1_free_xy/evidence/r1_f1_traps/
          if-no-files-found: ignore
