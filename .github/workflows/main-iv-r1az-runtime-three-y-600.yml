name: MAIN IV R1az runtime three Y profiles six pixel-exact original NPCs
on:
  push:
    branches:
      - research/main-iv-r1az-runtime-three-y-profiles-20261116
    paths:
      - .github/workflows/main-iv-r1az-runtime-three-y-600.yml
      - rom/v018/experiments/main_iv_r1az_runtime_y/**
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime-three-Y:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install DASM Stella 6.7.1 and screenshot audit tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dasm stella xvfb xdotool imagemagick python3-pil
          dpkg-query -W -f='${binary:Package} ${Version}\n' dasm stella | tee versions.txt
      - name: Build three pinned source-exact Y kernels in one NTSC F6 ROM
        run: /usr/bin/python3 rom/v018/experiments/main_iv_r1az_runtime_y/build_r1az.py
      - name: Capture 600 genuine consecutive Stella X11 frames
        timeout-minutes: 11
        run: bash rom/v018/experiments/main_iv_r1az_runtime_y/ci_framewalk_600.sh
      - name: Strict three runtime Y profiles and all six original 8x9 masks
        run: /usr/bin/python3 rom/v018/experiments/main_iv_r1az_runtime_y/analyze_600.py
      - name: Verify F6 format SHA and 600 evidence images
        run: |
          cd rom/v018/experiments/main_iv_r1az_runtime_y
          test "$(stat -c %s r1az_F6.bin)" -eq 16384
          sha256sum -c ROM_SHA256.txt
          test "$(find evidence_600/raw -name 'frame_*.png' | wc -l)" -eq 600
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: main-iv-r1az-three-runtime-Y-profiles-600
          path: |
            versions.txt
            rom/v018/experiments/main_iv_r1az_runtime_y/
          if-no-files-found: ignore
