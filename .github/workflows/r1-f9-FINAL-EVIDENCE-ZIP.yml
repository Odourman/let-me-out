name: R1-F9 FINAL READ ONLY one original ROM 144 Stella 48 TIA and 8 WSYNC
on:
  push:
    branches: [rom-dev/v018-r1-f9-three-binary-x-one-rom-20261117]
    paths: [.github/workflows/r1-f9-FINAL-EVIDENCE-ZIP.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  final-readonly-artifact-union:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Download unchanged fully hash-verified F9 original ROM and 144+144+48 primary evidence package
        uses: actions/download-artifact@v4
        with:
          name: LET_ME_OUT_R1_F9_COMBINED_ONE_F6_ROM_144_REAL_STELLA_48_TRAPS_SHA256_2026-11-17
          run-id: 44050557376
          repository: Odourman/let-me-out
          github-token: ${{ github.token }}
          path: seed_bundle/
      - name: Download 8 genuine supplementary WSYNC-after-write GUI screenshots from same unchanged original ROM
        uses: actions/download-artifact@v4
        with:
          name: LET_ME_OUT_R1_F9_SAME_UNCHANGED_ROM_EIGHT_TRUE_WSYNC_AFTER_WRITE_TRAPS
          run-id: 44050941747
          repository: Odourman/let-me-out
          github-token: ${{ github.token }}
          path: seed_wsync/
      - name: Verify every original SHA, original 16KiB ROM and WSYNC snapshots; recompute one final immutable SHA manifest NO DASM NO STELLA
        run: |
          python3 rom/v018/experiments/r1_free_xy/r1_f9_bundle_final.py
          cd seed_bundle
          sha256sum -c SHA256SUMS.txt >/dev/null
          python3 - <<'PY'
          import json
          from pathlib import Path
          x=json.load(open('EVIDENCE_FILE_INDEX.json'))
          m=json.load(open('F9_EVIDENCE_SUMMARY.json'))
          assert len(x)>471
          assert m['classification']=='F9_THREE_BINARY_RUNTIME_SELECTORS_LOCAL_PASS'
          assert m['REAL_STELLA_CROP_COUNT']==m['REAL_STELLA_FULL_GUI_COUNT']==144
          assert m['REAL_STELLA_PC_TIA_REGISTER_TRAPS']==48
          assert m['SUPPLEMENT_REAL_STELLA_WSYNC_AFTER_WRITE_TRAPS']==8
          assert m['F9_UNCHANGED_ROM_RECHECKED_SHA256']=='6c2585148eb082fb8bc794d664edc4869b18849fcfabb9cada23373d1dc1318b'
          assert len(list(Path('F9/evidence/r1_f9_one_rom/wsync_after').glob('mode_*/stella_full.png')))==8
          print('F9_FINAL_AUTHENTIC_EVIDENCE_ZIP_SOURCE_HASHES_PASS',len(x))
          PY
      - name: Upload single final original source evidence ZIP, no test and no assembler
        uses: actions/upload-artifact@v4
        with:
          name: LET_ME_OUT_R1_F9_FINAL_ONE_F6_ROM_144_STELLA_48_REG_8_WSYNC_SHA256_2026-11-17
          path: seed_bundle/
          if-no-files-found: error
