name: MAIN III R1o single arm-height M0 shot five NPC 600 Stella
on:
  push:
    branches:
      - research/main-iii-r1o-single-arm-shot-14rows-20261116
    paths:
      - .github/workflows/main-iii-r1o-single-arm-shot-600.yml
      - rom/v018/experiments/main_iii_r1o_single_arm_shot/build_r1o.py
      - rom/v018/experiments/main_iii_r1o_single_arm_shot/analyze_600.py
      - rom/v018/experiments/main_iii_r1o_single_arm_shot/ci_framewalk_600.sh
  workflow_dispatch:
permissions:
  contents: read
jobs:
  r1o-arm-shot:
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - name: Install DASM Stella 6.7.1 and screenshot capture
        run: |
          sudo apt-get update
          sudo apt-get install -y dasm stella xvfb xdotool imagemagick python3-pil
          dpkg-query -W -f='${binary:Package} ${Version}\n' dasm stella | tee versions.txt
      - name: Build from R1n14 SHA-pinned five-android baseline
        run: /usr/bin/python3 rom/v018/experiments/main_iii_r1o_single_arm_shot/build_r1o.py
      - name: Capture 600 consecutive actual Stella GUI frames
        timeout-minutes: 11
        run: bash rom/v018/experiments/main_iii_r1o_single_arm_shot/ci_framewalk_600.sh
      - name: Strict arm-shot x232 y167 no white duplicate, five original NPC pixel audit
        run: /usr/bin/python3 rom/v018/experiments/main_iii_r1o_single_arm_shot/analyze_600.py
      - name: Verify F6 16KiB exact hash and 600 screenshots
        run: |
          cd rom/v018/experiments/main_iii_r1o_single_arm_shot
          test "$(stat -c %s r1o_F6.bin)" -eq 16384
          sha256sum -c ROM_SHA256.txt
          test "$(find evidence_600/raw -name 'frame_*.png' | wc -l)" -eq 600
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: main-iii-r1o-hand-shot-14-row-five-npc-600-stella
          path: |
            versions.txt
            rom/v018/experiments/main_iii_r1o_single_arm_shot/
          if-no-files-found: ignore
