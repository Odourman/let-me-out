name: MAIN IV R1au repair earlier independent male P1 GRP original pixels
on:
  push:
    branches:
      - research/main-iv-r1au-early-first-grp1-20261116
    paths:
      - .github/workflows/main-iv-r1au-male-grp1-600.yml
      - rom/v018/experiments/main_iv_r1au_early_grp/**
  workflow_dispatch:
permissions:
  contents: read
jobs:
  earlier-male-GRP1:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        variant: [0, 1, 2]
    env:
      R1AU_VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@v4
      - name: Install DASM Stella 6.7.1 X11 audit tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dasm stella xvfb xdotool imagemagick python3-pil
          dpkg-query -W -f='${binary:Package} ${Version}\n' dasm stella | tee versions.txt
      - name: Build pin verified R1at with first P1 GRP1 moved earlier
        run: /usr/bin/python3 rom/v018/experiments/main_iv_r1au_early_grp/build_r1au.py
      - name: Capture 600 consecutive real Stella GUI frames
        timeout-minutes: 11
        run: bash rom/v018/experiments/main_iv_r1au_early_grp/ci_framewalk_600.sh
      - name: Fail closed original 6 NPC, one complete yellow P0 and one M0
        run: /usr/bin/python3 rom/v018/experiments/main_iv_r1au_early_grp/analyze_600.py
      - name: Confirm ROM SHA256 F6 length and 600 frames
        run: |
          cd rom/v018/experiments/main_iv_r1au_early_grp
          test "$(stat -c %s r1au_F6.bin)" -eq 16384
          sha256sum -c ROM_SHA256.txt
          test "$(find evidence_600/raw -name 'frame_*.png' | wc -l)" -eq 600
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: main-iv-r1au-variant-${{ matrix.variant }}-male-GRP1-600
          path: |
            versions.txt
            rom/v018/experiments/main_iv_r1au_early_grp/
          if-no-files-found: ignore
