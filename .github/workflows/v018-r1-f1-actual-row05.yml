name: R1-F1 exact damaged row05 Stella trace only
on:
  push:
    branches:
      - rom-dev/v018-r1-f1-sixmask-forensics-20261116
    paths:
      - .github/workflows/v018-r1-f1-actual-row05.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  actual-row05-traps:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install actual DASM and Stella
        run: |
          sudo apt-get update
          sudo apt-get install -y dasm stella xvfb xdotool imagemagick python3-pil
          dpkg-query -W -f='${binary:Package} ${Version}\n' dasm stella > r1_f1_row05_tool_versions.txt
      - name: Rebuild ONLY frozen originals byte-identically
        run: |
          cd rom/v018/experiments/r1_free_xy
          /usr/bin/python3 build_scaling.py
          /usr/bin/python3 build_six_sweep.py
          printf '%s  %s\n' \
            5368d88474187604284c8348054dc6f68cdaeec8492a2ad0d5cd659e4e48a506 dist/r1_individual_5_F6.bin \
            36e588b7211be9dfe6afc534117823f6540aa6d3b753c2816a22c5828d0b60b4 dist/r1_individual_6B_F6.bin \
            c9c71fb9c41cee3d1c5bb4839c7d4bbea759151e4e49510b98d4ed3ad2f03c58 dist/r1_individual_6C_F6.bin > r1_f1_row05_expected_sha256.txt
          sha256sum -c r1_f1_row05_expected_sha256.txt
      - name: Observe true source Row05 via Stella scanline 123, PC and bank
        run: bash rom/v018/experiments/r1_free_xy/r1_f1_trace_actual_row05.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r1-f1-exact-source-row05-stella-write-traces
          path: |
            r1_f1_row05_tool_versions.txt
            rom/v018/experiments/r1_free_xy/r1_f1_row05_expected_sha256.txt
            rom/v018/experiments/r1_free_xy/evidence/r1_f1_actual_row05_traps/
          if-no-files-found: ignore
