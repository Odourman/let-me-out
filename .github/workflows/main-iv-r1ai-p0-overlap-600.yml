name: MAIN IV R1ai isolate P0 P1 overlap in third original NPC
on:
  push:
    branches:
      - research/main-iv-r1ai-player-p0-separation-20261116
    paths:
      - .github/workflows/main-iv-r1ai-p0-overlap-600.yml
      - rom/v018/experiments/main_iv_r1ai_p0_overlap_control/**
  workflow_dispatch:
permissions:
  contents: read
jobs:
  p0-overlap-control:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        batch: [0, 1]
    env:
      R1AI_BATCH: ${{ matrix.batch }}
    steps:
      - uses: actions/checkout@v4
      - name: Install DASM Stella X11 and strict pixel audit requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y dasm stella xvfb xdotool imagemagick python3-pil
          dpkg-query -W -f='${binary:Package} ${Version}\n' dasm stella | tee versions.txt
      - name: Build pinned failing R1ah with only P0 RESP0 delay changed
        run: /usr/bin/python3 rom/v018/experiments/main_iv_r1ai_p0_overlap_control/build_r1ai.py
      - name: Capture 600 consecutive authentic Stella frames
        timeout-minutes: 11
        run: bash rom/v018/experiments/main_iv_r1ai_p0_overlap_control/ci_framewalk_600.sh
      - name: Pixel audit all three original white masks one player one shot
        run: /usr/bin/python3 rom/v018/experiments/main_iv_r1ai_p0_overlap_control/analyze_600.py
      - name: ROM hash and size confirmation
        run: |
          cd rom/v018/experiments/main_iv_r1ai_p0_overlap_control
          test "$(stat -c %s r1ai_F6.bin)" -eq 16384
          sha256sum -c ROM_SHA256.txt
          test "$(find evidence_600/raw -name 'frame_*.png' | wc -l)" -eq 600
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: main-iv-r1ai-batch-${{ matrix.batch }}-p0-occlusion-control-600
          path: |
            versions.txt
            rom/v018/experiments/main_iv_r1ai_p0_overlap_control/
          if-no-files-found: ignore
