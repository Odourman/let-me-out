name: MAIN IV R1ag reversed P1 masks and close-X real Stella
on:
  push:
    branches:
      - research/main-iv-r1ag-mask-order-close-x-20261116
    paths:
      - .github/workflows/main-iv-r1ag-mask-order-close-600.yml
      - rom/v018/experiments/main_iv_r1ag_mask_order/**
  workflow_dispatch:
permissions:
  contents: read
jobs:
  swap-and-close:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        batch: [0, 1, 2, 3, 4, 5]
    env:
      R1AG_BATCH: ${{ matrix.batch }}
    steps:
      - uses: actions/checkout@v4
      - name: Install DASM Stella 6.7.1 and real X11 screen capture tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dasm stella xvfb xdotool imagemagick python3-pil
          dpkg-query -W -f='${binary:Package} ${Version}\n' dasm stella | tee versions.txt
      - name: Assemble from pinned R1af and preserve original nine-row masks
        run: /usr/bin/python3 rom/v018/experiments/main_iv_r1ag_mask_order/build_r1ag.py
      - name: Capture 600 consecutive authentic Stella screenshots
        timeout-minutes: 11
        run: bash rom/v018/experiments/main_iv_r1ag_mask_order/ci_framewalk_600.sh
      - name: Strict per-frame original-mask pixel audit with swapped mask order
        run: /usr/bin/python3 rom/v018/experiments/main_iv_r1ag_mask_order/analyze_600.py
      - name: Verify standard F6 size and ROM SHA256
        run: |
          cd rom/v018/experiments/main_iv_r1ag_mask_order
          test "$(stat -c %s r1ag_F6.bin)" -eq 16384
          sha256sum -c ROM_SHA256.txt
          test "$(find evidence_600/raw -name 'frame_*.png' | wc -l)" -eq 600
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: main-iv-r1ag-batch-${{ matrix.batch }}-600-true-stella
          path: |
            versions.txt
            rom/v018/experiments/main_iv_r1ag_mask_order/
          if-no-files-found: ignore
