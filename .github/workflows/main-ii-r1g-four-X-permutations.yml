name: MAIN II R1g four independent fourth NPC X orderings in Stella
on:
  push:
    branches:
      - research/main-ii-r1g-fourth-x-four-permutations-20261116
    paths:
      - .github/workflows/main-ii-r1g-four-X-permutations.yml
      - rom/v018/experiments/main_ii_r1g_four_positions/**
  workflow_dispatch:
permissions:
  contents: read
jobs:
  r1g-four-offsets:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - name: Install DASM Stella 6.7.1 and Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y dasm stella xvfb imagemagick python3-pil
          dpkg-query -W -f='${binary:Package} ${Version}\n' dasm stella | tee versions.txt
      - name: Build four cycle-identical independent fourth-original X probes
        run: /usr/bin/python3 rom/v018/experiments/main_ii_r1g_four_positions/build.py
      - name: Capture four actual raw Stella frames and second RESP0 debugger cycles
        run: bash rom/v018/experiments/main_ii_r1g_four_positions/ci_capture.sh
      - name: Verify 4 original 8x9 masks P0 and M0, plus at least three distinct white X
        run: /usr/bin/python3 rom/v018/experiments/main_ii_r1g_four_positions/audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: main-ii-r1g-four-independent-fourth-NPC-X-evidence
          path: |
            versions.txt
            rom/v018/experiments/main_ii_r1g_four_positions/
          if-no-files-found: ignore
