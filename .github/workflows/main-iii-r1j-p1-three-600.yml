name: MAIN III R1j P1 three X P0 four X 600 real Stella frames
on:
  push:
    branches:
      - research/main-iii-r1j-p1-third-x-20261116
    paths:
      - .github/workflows/main-iii-r1j-p1-three-600.yml
      - rom/v018/experiments/main_iii_r1j_p1_three/build_r1j.py
      - rom/v018/experiments/main_iii_r1j_p1_three/ci_framewalk_600.sh
      - rom/v018/experiments/main_iii_r1j_p1_three/analyze_600.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  r1j-three-P1-four-P0-600:
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - name: Install DASM Stella X11 screen capture
        run: |
          sudo apt-get update
          sudo apt-get install -y dasm stella xvfb xdotool imagemagick python3-pil
          dpkg-query -W -f='${binary:Package} ${Version}\n' dasm stella | tee versions.txt
      - name: Build R1j 12 cycle-neutral row kernels from verified R1i
        run: /usr/bin/python3 rom/v018/experiments/main_iii_r1j_p1_three/build_r1j.py
      - name: Capture 600 consecutive Stella frames
        timeout-minutes: 11
        run: bash rom/v018/experiments/main_iii_r1j_p1_three/ci_framewalk_600.sh
      - name: Fail-closed 24 combinations original 8x9 masks two X axes left wall right doorway
        run: /usr/bin/python3 rom/v018/experiments/main_iii_r1j_p1_three/analyze_600.py
      - name: Check 16KiB F6 ROM hash and evidence frame count
        run: |
          cd rom/v018/experiments/main_iii_r1j_p1_three
          test "$(stat -c %s r1j_F6.bin)" -eq 16384
          sha256sum -c ROM_SHA256.txt
          test "$(find evidence_600/raw -name 'frame_*.png' | wc -l)" -eq 600
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: main-iii-r1j-p1-three-x-p0-four-x-600-evidence
          path: |
            versions.txt
            rom/v018/experiments/main_iii_r1j_p1_three/
          if-no-files-found: ignore
