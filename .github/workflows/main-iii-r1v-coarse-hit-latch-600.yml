name: MAIN III R1v RESM0 coarse bullet into first P1 CXM0P 600
on:
  push:
    branches:
      - research/main-iii-r1v-resm0-coarse-overlap-20261116
    paths:
      - .github/workflows/main-iii-r1v-coarse-hit-latch-600.yml
      - rom/v018/experiments/main_iii_r1v_resm0_overlap/build_r1v.py
      - rom/v018/experiments/main_iii_r1v_resm0_overlap/analyze_600.py
      - rom/v018/experiments/main_iii_r1v_resm0_overlap/ci_framewalk_600.sh
  workflow_dispatch:
permissions:
  contents: read
jobs:
  coarse-missile-and-real-collision:
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - name: Install DASM Stella and graphical capture tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dasm stella xvfb xdotool imagemagick python3-pil
          dpkg-query -W -f='${binary:Package} ${Version}\n' dasm stella | tee versions.txt
      - name: Build coarse RESM0 and TIA real collision latch research
        run: /usr/bin/python3 rom/v018/experiments/main_iii_r1v_resm0_overlap/build_r1v.py
      - name: Capture 600 consecutive real Stella GUI frames
        timeout-minutes: 11
        run: bash rom/v018/experiments/main_iii_r1v_resm0_overlap/ci_framewalk_600.sh
      - name: Fail-closed x250-264 plus 5 NPC original masks and true M0-P1 CXM0P collision indication
        run: /usr/bin/python3 rom/v018/experiments/main_iii_r1v_resm0_overlap/analyze_600.py
      - name: Validate standard 16KiB F6 ROM and source hash
        run: |
          cd rom/v018/experiments/main_iii_r1v_resm0_overlap
          test "$(stat -c %s r1v_F6.bin)" -eq 16384
          sha256sum -c ROM_SHA256.txt
          test "$(find evidence_600/raw -name 'frame_*.png' | wc -l)" -eq 600
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: main-iii-r1v-resm0-coarse-p1-hit-600
          path: |
            versions.txt
            rom/v018/experiments/main_iii_r1v_resm0_overlap/
          if-no-files-found: ignore
