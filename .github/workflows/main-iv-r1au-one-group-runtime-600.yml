name: MAIN IV R1au one group moves per transition six Androids one ROM
on:
  push:
    branches:
      - research/main-iv-r1au-one-group-moves-per-transition-20261116
    paths:
      - .github/workflows/main-iv-r1au-one-group-runtime-600.yml
      - rom/v018/experiments/main_iv_r1au_controlled_walk/**
  workflow_dispatch:
permissions:
  contents: read
jobs:
  one-pair-runtime-walk:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install DASM Stella 6.7.1 and authentic X11 screenshot tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dasm stella xvfb xdotool imagemagick python3-pil
          dpkg-query -W -f='${binary:Package} ${Version}\n' dasm stella | tee versions.txt
      - name: Rebuild proven six-mask R1at and change only ABCA to ABCB runtime state
        run: /usr/bin/python3 rom/v018/experiments/main_iv_r1au_controlled_walk/build_r1au.py
      - name: Capture 600 authentic consecutive Stella frame screenshots
        timeout-minutes: 11
        run: bash rom/v018/experiments/main_iv_r1au_controlled_walk/ci_framewalk_600.sh
      - name: Six original full masks + yellow P0 M0 + exact ABCB one-pair phase cycle
        run: /usr/bin/python3 rom/v018/experiments/main_iv_r1au_controlled_walk/analyze_600.py
      - name: Verify 16 KB ROM SHA256 and 600 Stella screenshots
        run: |
          cd rom/v018/experiments/main_iv_r1au_controlled_walk
          test "$(stat -c %s r1au_F6.bin)" -eq 16384
          sha256sum -c ROM_SHA256.txt
          test "$(find evidence_600/raw -name 'frame_*.png' | wc -l)" -eq 600
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: main-iv-r1au-abcb-runtime-one-group-at-time-six-originals-600
          path: |
            versions.txt
            rom/v018/experiments/main_iv_r1au_controlled_walk/
          if-no-files-found: ignore
