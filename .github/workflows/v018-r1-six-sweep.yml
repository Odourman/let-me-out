name: v018 R1 six individual RESP1 retriggers cycle sweep (real Stella)
on:
  push:
    branches: [rom-dev/v018-r1-independent-xy-20261116]
    paths:
      - .github/workflows/v018-r1-six-sweep.yml
      - rom/v018/experiments/r1_free_xy/build_six_sweep.py
      - rom/v018/experiments/r1_free_xy/capture_six_sweep.sh
      - rom/v018/experiments/r1_free_xy/analyze_six_sweep.py
  workflow_dispatch:
permissions: {contents: read}
jobs:
  sweep:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - name: Install actual 6502 compiler and Stella
        run: |
          sudo apt-get update
          sudo apt-get install -y dasm stella xvfb xdotool imagemagick python3-pil
          dpkg-query -W -f='${binary:Package} ${Version}\n' dasm stella python3-pil > r1_sweep_tool_versions.txt
      - name: Build four alternative six-reset phase schedules (unaltered canonical original masks)
        run: |
          cd rom/v018/experiments/r1_free_xy
          /usr/bin/python3 build_six_sweep.py
          for m in 6B 6C 6D 6E; do test "$(stat -c %s dist/r1_individual_${m}_F6.bin)" -eq 16384; done
          sha256sum dist/r1_individual_6?_F6.bin > dist/six_sweep_SHA256SUMS.txt
          sha256sum -c dist/six_sweep_SHA256SUMS.txt
      - name: Capture raw Stella screenshots of six independently reset P1 copies in each phase schedule
        run: bash rom/v018/experiments/r1_free_xy/capture_six_sweep.sh
      - name: Evaluate full six-mask source-pixel integrity in authentic Stella (never skip failures)
        continue-on-error: true
        run: /usr/bin/python3 rom/v018/experiments/r1_free_xy/analyze_six_sweep.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: letmeout-r1-six-independent-resp-phase-sweep-stella
          path: |
            r1_sweep_tool_versions.txt
            rom/v018/experiments/r1_free_xy/
          if-no-files-found: ignore
