name: MAIN II R1f independent white fourth X via dual RESP0
on:
  push:
    branches:
      - research/main-ii-r1f-resp0-independent-fourth-20261116
    paths:
      - .github/workflows/main-ii-r1f-independent-resp0.yml
      - rom/v018/experiments/main_ii_r1f_resp0/**
  workflow_dispatch:
permissions:
  contents: read
jobs:
  r1f-two-positions:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - name: Install actual DASM, Stella, X11 and PIL
        run: |
          sudo apt-get update
          sudo apt-get install -y dasm stella xvfb imagemagick python3-pil
          dpkg-query -W -f='${binary:Package} ${Version}\n' dasm stella | tee versions.txt
      - name: Build two 16KB standard F6 same-line dual-RESP0 candidates
        run: /usr/bin/python3 rom/v018/experiments/main_ii_r1f_resp0/build.py
      - name: Record real Stella images and eight pre-write RESP0 and RESP1 PC checkpoints
        run: bash rom/v018/experiments/main_ii_r1f_resp0/ci_capture.sh
      - name: Fail-closed mask-and-X-independence pixel audit
        run: /usr/bin/python3 rom/v018/experiments/main_ii_r1f_resp0/audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: main-ii-r1f-dual-resp0-fourth-x-evidence
          path: |
            versions.txt
            rom/v018/experiments/main_ii_r1f_resp0/
          if-no-files-found: ignore
