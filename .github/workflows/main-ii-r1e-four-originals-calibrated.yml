name: MAIN II R1e calibrated P0 four-original-mask 262 NTSC
on:
  push:
    branches:
      - research/main-ii-r1e-four-originals-p0wide-calibrated-20261116
    paths:
      - .github/workflows/main-ii-r1e-four-originals-calibrated.yml
      - rom/v018/experiments/main_ii_p0_four/**
  workflow_dispatch:
permissions:
  contents: read
jobs:
  four-originals:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install DASM Stella 6.7.1 and X11 PIL
        run: |
          sudo apt-get update
          sudo apt-get install -y dasm stella xvfb imagemagick python3-pil
          dpkg-query -W -f='${binary:Package} ${Version}\n' dasm stella | tee versions.txt
      - name: Assemble 16KB standard F6 NTSC four-original-mask probe
        run: bash rom/v018/experiments/main_ii_p0_four/build.sh
      - name: Capture Stella real image and five true CPU PC stops
        run: bash rom/v018/experiments/main_ii_p0_four/ci_stella.sh
      - name: Validate four original masks and P0 yellow and only one M0
        run: /usr/bin/python3 rom/v018/experiments/main_ii_p0_four/audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: main-ii-r1e-four-originals-calibrated-evidence
          path: |
            versions.txt
            rom/v018/experiments/main_ii_p0_four/
          if-no-files-found: ignore
