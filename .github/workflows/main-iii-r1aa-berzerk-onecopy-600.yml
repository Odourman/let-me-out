name: MAIN III R1aa Berzerk ONE_COPY D special missile 600 Stella
on:
  push:
    branches:
      - research/main-iii-r1aa-berzerk-nusiz0-onecopy-test-20261116
    paths:
      - .github/workflows/main-iii-r1aa-berzerk-onecopy-600.yml
      - rom/v018/experiments/main_iii_r1aa_onecopy_d/build_r1aa.py
      - rom/v018/experiments/main_iii_r1aa_onecopy_d/analyze_600.py
      - rom/v018/experiments/main_iii_r1aa_onecopy_d/ci_framewalk_600.sh
  workflow_dispatch:
permissions:
  contents: read
jobs:
  onecopy-d:
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - name: Install DASM Stella X11 tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dasm stella xvfb xdotool imagemagick python3-pil
          dpkg-query -W -f='${binary:Package} ${Version}\n' dasm stella | tee versions.txt
      - name: Build pinned R1y D ONE_COPY scanline experiment
        run: /usr/bin/python3 rom/v018/experiments/main_iii_r1aa_onecopy_d/build_r1aa.py
      - name: Capture 600 consecutive real Stella 6.7.1 frames
        timeout-minutes: 11
        run: bash rom/v018/experiments/main_iii_r1aa_onecopy_d/ci_framewalk_600.sh
      - name: Fail-closed five original NPC 14-row exact pixel, yellow M0, collision and 64 states
        run: /usr/bin/python3 rom/v018/experiments/main_iii_r1aa_onecopy_d/analyze_600.py
      - name: Validate 16KiB standard F6 ROM hash and screenshot count
        run: |
          cd rom/v018/experiments/main_iii_r1aa_onecopy_d
          test "$(stat -c %s r1aa_F6.bin)" -eq 16384
          sha256sum -c ROM_SHA256.txt
          test "$(find evidence_600/raw -name 'frame_*.png' | wc -l)" -eq 600
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: main-iii-r1aa-berzerk-onecopy-d-stella-600
          path: |
            versions.txt
            rom/v018/experiments/main_iii_r1aa_onecopy_d/
          if-no-files-found: ignore
