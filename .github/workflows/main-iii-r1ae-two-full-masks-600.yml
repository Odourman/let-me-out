name: MAIN III R1ae late first GRP1 full two original P1 masks 600 Stella
on:
  push:
    branches:
      - research/main-iii-r1ae-late-grp1-finish-20261116
    paths:
      - .github/workflows/main-iii-r1ae-two-full-masks-600.yml
      - rom/v018/experiments/main_iii_r1ae_later_grp1/build_r1ae.py
      - rom/v018/experiments/main_iii_r1ae_later_grp1/analyze_600.py
      - rom/v018/experiments/main_iii_r1ae_later_grp1/ci_framewalk_600.sh
  workflow_dispatch:
permissions:
  contents: read
jobs:
  delay-first-grp1-2-more-cycles:
    runs-on: ubuntu-24.04
    timeout-minutes: 19
    steps:
      - uses: actions/checkout@v4
      - name: Install DASM Stella 6.7.1 and real X11 snapshot tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dasm stella xvfb xdotool imagemagick python3-pil
          dpkg-query -W -f='${binary:Package} ${Version}\n' dasm stella | tee versions.txt
      - name: Build from pinned R1ad and verify exact RESP1 c30/42 c32/42 c30/44 c32/44
        run: /usr/bin/python3 rom/v018/experiments/main_iii_r1ae_later_grp1/build_r1ae.py
      - name: Capture 600 consecutive true Stella 6.7.1 GUI frames
        timeout-minutes: 11
        run: bash rom/v018/experiments/main_iii_r1ae_later_grp1/ci_framewalk_600.sh
      - name: Fail-closed 600 white masks and zero ghost with four independent X, yellow P0 M0
        run: /usr/bin/python3 rom/v018/experiments/main_iii_r1ae_later_grp1/analyze_600.py
      - name: Verify SHA F6 ROM and number of PNG files
        run: |
          cd rom/v018/experiments/main_iii_r1ae_later_grp1
          test "$(stat -c %s r1ae_F6.bin)" -eq 16384
          sha256sum -c ROM_SHA256.txt
          test "$(find evidence_600/raw -name 'frame_*.png' | wc -l)" -eq 600
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: main-iii-r1ae-two-original-p1-masks-600-real-stella
          path: |
            versions.txt
            rom/v018/experiments/main_iii_r1ae_later_grp1/
          if-no-files-found: ignore
