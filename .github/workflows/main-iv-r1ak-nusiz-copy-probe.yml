name: MAIN IV R1ak NUSIZ copy modes strict 600-frame Stella
on:
  push:
    branches:
      - research/main-iv-r1ak-nusiz-auto-copies-20261116
    paths:
      - .github/workflows/main-iv-r1ak-nusiz-copy-probe.yml
      - rom/v018/experiments/main_iv_r1ak_nusiz_probe/**
  workflow_dispatch:
permissions:
  contents: read
jobs:
  nusiz-copy-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mode: [0, 1, 2, 3, 4, 6]
    env:
      R1AK_MODE: ${{ matrix.mode }}
    steps:
      - uses: actions/checkout@v4
      - name: Install DASM Stella and real X11 screenshot tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dasm stella xvfb xdotool imagemagick python3-pil
          dpkg-query -W -f='${binary:Package} ${Version}\n' dasm stella | tee versions.txt
      - name: Build from pinned R1aj four-mask PASS; ONLY NUSIZ1 different
        run: /usr/bin/python3 rom/v018/experiments/main_iv_r1ak_nusiz_probe/build_r1ak.py
      - name: Capture 600 consecutive real Stella X11 frames
        timeout-minutes: 11
        run: bash rom/v018/experiments/main_iv_r1ak_nusiz_probe/ci_framewalk_600.sh
      - name: Strict six-copy and original-mask pixel audit
        run: /usr/bin/python3 rom/v018/experiments/main_iv_r1ak_nusiz_probe/analyze_600.py
      - name: ROM size, checksum, and 600-frame evidence
        run: |
          cd rom/v018/experiments/main_iv_r1ak_nusiz_probe
          test "$(stat -c %s r1ak_F6.bin)" -eq 16384
          sha256sum -c ROM_SHA256.txt
          test "$(find evidence_600/raw -name 'frame_*.png' | wc -l)" -eq 600
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: main-iv-r1ak-nusiz-${{ matrix.mode }}-600-real-stella
          path: |
            versions.txt
            rom/v018/experiments/main_iv_r1ak_nusiz_probe/
          if-no-files-found: ignore
