name: "G5AL LM-D25 F9-only stable debugger and bank-neutral four-break harness - NO ROM BUILD"
# SECOND AND FINAL AUTHORIZED G5AL MEASUREMENT - targeted post-run real debugger prompt handshake; see TARGETED_CORRECTION_BEFORE_SECOND_FINAL_RUN.md.
# No workflow_dispatch. Branch isolated. NEVER rerun old G5AJ failures.
on:
  push:
    branches:
      - rom-dev-iii/g5al-lm-d25-f9-stable-bank-neutral-20261118
    paths:
      - .github/workflows/g5al_f9_stable_bank_neutral.yml
permissions:
  contents: read
  actions: read
jobs:
  capture-existing-f9-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - name: Install exact distribution Stella 6.7.1 debugger and X11 analysis helpers - never DASM
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y stella xvfb xdotool x11-utils imagemagick python3-pil
          dpkg-query -W stella
          dpkg-query -W -f='${Version}\n' stella | grep -q '^6\.7\.1'
      - name: Download original unchanged F9 ROM source/list/sym only from historical Actions artifact
        uses: actions/download-artifact@v4
        with:
          name: LET_ME_OUT_R1_F9_ONE_ROM_AND_ACTUAL_STELLA_PARTIAL_OR_COMPLETE_G1
          repository: Odourman/let-me-out
          run-id: 44050126727
          github-token: ${{ github.token }}
          path: seed_f9/
      - name: Download frozen G5AF M native TIA comparison reference from original successful run
        uses: actions/download-artifact@v4
        with:
          name: G5AF_F9_ORIGINAL_READONLY_NATIVE_TIA_AND_DEBUGGER_EVIDENCE
          repository: Odourman/let-me-out
          run-id: 44178247577
          github-token: ${{ github.token }}
          path: ref_g5af/
      - name: Static preregistration / frozen source and scripts before measurement
        shell: bash
        run: |
          set -euo pipefail
          test -s rom/g5al_f9_method_2026-11-18/PREREGISTERED_F9_METHOD.md
          test -s ref_g5af/F9_000_M_RESP1/native_TIA_original.png
          python3 -m py_compile rom/g5al_f9_method_2026-11-18/audit_g5al.py rom/g5al_f9_method_2026-11-18/check_f9_frozen.py
          bash -n rom/g5al_f9_method_2026-11-18/run_g5al_f9.sh
          echo "G5AL_BASH_PYTHON_STATIC_PASS_NO_ROM_BUILD"
      - name: First measured F9-only interactive Stella A then B then C, or hard STOP
        shell: bash
        run: |
          set -euo pipefail
          bash rom/g5al_f9_method_2026-11-18/run_g5al_f9.sh
      - name: Preserve actual pre/post Stella transcripts native TIA image audit negative evidence and postwait SHA
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: G5AL_LM_D25_F9_STABLE_PROMPT_BANK_NEUTRAL_ORIGINAL_EVIDENCE
          path: rom/g5al_f9_method_2026-11-18/evidence/
          retention-days: 90
          if-no-files-found: warn
  verify-preserved-original-artifact:
    needs: capture-existing-f9-only
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Independently download raw original evidence from THIS exact run
        uses: actions/download-artifact@v4
        with:
          name: G5AL_LM_D25_F9_STABLE_PROMPT_BANK_NEUTRAL_ORIGINAL_EVIDENCE
          path: verify_artifact/
      - name: Check all original archived files by original postshutdown SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          cd verify_artifact
          test -s SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          test -s G5AL_EVIDENCE.csv
          test -s G5AL_AUDIT.json
          test -s G5AL_PRE_ARCHIVE_VERDICT.txt
          test -s script_exit_code.txt
          echo "G5AL_ORIGINAL_ARCHIVE_READBACK_SHA256_PASS_ONLY_NOT_METHOD_PASS"
