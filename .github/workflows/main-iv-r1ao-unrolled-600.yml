name: MAIN IV R1ao unrolled nine row potential six full original P1 masks
on:
  push:
    branches:
      - research/main-iv-r1ao-unrolled-nine-row-six-copy-20261116
    paths:
      - .github/workflows/main-iv-r1ao-unrolled-600.yml
      - rom/v018/experiments/main_iv_r1ao_unrolled/**
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unrolled-six-original-masks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install DASM Stella and screenshot pixel audit requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y dasm stella xvfb xdotool imagemagick python3-pil
          dpkg-query -W -f='${binary:Package} ${Version}\n' dasm stella | tee versions.txt
      - name: Build pinned four-mask ROM with nine row unrolling and NUSIZ3
        run: /usr/bin/python3 rom/v018/experiments/main_iv_r1ao_unrolled/build_r1ao.py
      - name: Capture 600 authentic consecutive real Stella X11 frames
        timeout-minutes: 11
        run: bash rom/v018/experiments/main_iv_r1ao_unrolled/ci_framewalk_600.sh
      - name: Fail closed all source-exact 2M2F SM SF plus P0 and M0
        run: /usr/bin/python3 rom/v018/experiments/main_iv_r1ao_unrolled/analyze_600.py
      - name: Verify 16 KB ROM SHA and 600 raw Stella images
        run: |
          cd rom/v018/experiments/main_iv_r1ao_unrolled
          test "$(stat -c %s r1ao_F6.bin)" -eq 16384
          sha256sum -c ROM_SHA256.txt
          test "$(find evidence_600/raw -name 'frame_*.png' | wc -l)" -eq 600
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: main-iv-r1ao-unrolled-nine-row-six-source-mask-600
          path: |
            versions.txt
            rom/v018/experiments/main_iv_r1ao_unrolled/
          if-no-files-found: ignore
