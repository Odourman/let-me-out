name: MAIN II trick 05 dynamic PF sprite measured in Stella
on:
  push:
    branches:
      - research/main-ii-trick05-dynamic-pf-20261116
    paths:
      - .github/workflows/main-ii-trick05-dynamic-pf.yml
      - rom/v018/experiments/main_ii_trick05_dynamic_pf/**
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dynamic-pf:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install DASM Stella Xvfb and imagemagick
        run: |
          sudo apt-get update
          sudo apt-get install -y dasm stella xvfb imagemagick python3-pil
      - name: Compile four PF1 shifted patterns as standard-F6 16KB
        run: /usr/bin/python3 rom/v018/experiments/main_ii_trick05_dynamic_pf/build.py
      - name: Capture real Stella 262NTSC graphic variants
        run: bash rom/v018/experiments/main_ii_trick05_dynamic_pf/ci_stella.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: main-ii-trick05-dynamic-pf-stella-evidence
          path: rom/v018/experiments/main_ii_trick05_dynamic_pf/
          if-no-files-found: ignore
