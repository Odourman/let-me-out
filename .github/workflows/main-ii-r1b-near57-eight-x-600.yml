name: MAIN II R1b near57 eight-X 600 frame recovery
on:
  push:
    branches:
      - research/main-ii-r1b-near57-eight-x-600-20261116
    paths:
      - .github/workflows/main-ii-r1b-near57-eight-x-600.yml
      - rom/v018/experiments/main_ii_xmatrix_600/**
  workflow_dispatch:
permissions:
  contents: read
jobs:
  r1b-xmatrix-600:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install real DASM Stella X11 and PIL
        run: |
          sudo apt-get update
          sudo apt-get install -y dasm stella xvfb xdotool imagemagick python3-pil
          dpkg-query -W -f='${binary:Package} ${Version}\n' dasm stella | tee versions.txt
      - name: DASM reproducible isolated standard-F6 ROM
        run: bash rom/v018/experiments/main_ii_xmatrix_600/build.sh
      - name: Capture 600 consecutive raw Stella debugger frame crops
        timeout-minutes: 10
        run: bash rom/v018/experiments/main_ii_xmatrix_600/ci_framewalk_600.sh
      - name: Audit 600 actual frames and all eight coarse-X positions
        run: /usr/bin/python3 rom/v018/experiments/main_ii_xmatrix_600/analyze_600.py
      - name: Check 16KB F6 and capture count
        run: |
          cd rom/v018/experiments/main_ii_xmatrix_600
          test "$(stat -c %s xmatrix_F6.bin)" -eq 16384
          sha256sum -c SHA256SUMS.txt
          test "$(find evidence_600/raw -name 'frame_*.png' | wc -l)" -eq 600
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: main-ii-r1b-near57-eight-x-600-frames
          path: |
            versions.txt
            rom/v018/experiments/main_ii_xmatrix_600/
          if-no-files-found: ignore
