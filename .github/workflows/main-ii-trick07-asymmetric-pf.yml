name: MAIN II trick 07 asymmetric right-only PF0 door Stella
on:
  push:
    branches:
      - research/main-ii-trick07-asymmetric-pf-20261116
    paths:
      - .github/workflows/main-ii-trick07-asymmetric-pf.yml
      - rom/v018/experiments/main_ii_trick07_asym_pf/**
  workflow_dispatch:
permissions:
  contents: read
jobs:
  r3-rightdoor-asymmetric:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Install DASM, Stella and PIL
        run: |
          sudo apt-get update
          sudo apt-get install -y dasm stella xvfb imagemagick python3-pil
      - name: Build standard F6 NTSC reflected PF0 asymmetric door diagnostic
        run: bash rom/v018/experiments/main_ii_trick07_asym_pf/build.sh
      - name: Capture actual locked and open Stella screenshots
        run: bash rom/v018/experiments/main_ii_trick07_asym_pf/ci_capture.sh
      - name: Verify only right edge opens and left edge never opens in real raster
        run: /usr/bin/python3 rom/v018/experiments/main_ii_trick07_asym_pf/audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: main-ii-trick07-asymmetric-PF-rightdoor-evidence
          path: rom/v018/experiments/main_ii_trick07_asym_pf/
          if-no-files-found: ignore
