name: MAIN III R1s four P0 X single hand shot five NPC 600 Stella
on:
  push:
    branches:
      - research/main-iii-r1s-early-m0-off-delayed-grp0-4x-20261116
    paths:
      - .github/workflows/main-iii-r1s-four-x-hand-shot-600.yml
      - rom/v018/experiments/main_iii_r1s_reorder_arm_shot/build_r1s.py
      - rom/v018/experiments/main_iii_r1s_reorder_arm_shot/analyze_600.py
      - rom/v018/experiments/main_iii_r1s_reorder_arm_shot/ci_framewalk_600.sh
  workflow_dispatch:
permissions:
  contents: read
jobs:
  five-npc-four-p0-x-single-shot:
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - name: Install DASM Stella X11 and screen capture tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dasm stella xvfb xdotool imagemagick python3-pil
          dpkg-query -W -f='${binary:Package} ${Version}\n' dasm stella | tee versions.txt
      - name: Build R1s cycle-neutral C/D shot-kernel reorder pinned to R1o
        run: /usr/bin/python3 rom/v018/experiments/main_iii_r1s_reorder_arm_shot/build_r1s.py
      - name: Capture 600 consecutive actual Stella frames
        timeout-minutes: 11
        run: bash rom/v018/experiments/main_iii_r1s_reorder_arm_shot/ci_framewalk_600.sh
      - name: Fail-closed four P0 X plus two doors plus five original NPC plus exactly one M0
        run: /usr/bin/python3 rom/v018/experiments/main_iii_r1s_reorder_arm_shot/analyze_600.py
      - name: Verify standard F6 ROM SHA and all 600 PNG
        run: |
          cd rom/v018/experiments/main_iii_r1s_reorder_arm_shot
          test "$(stat -c %s r1s_F6.bin)" -eq 16384
          sha256sum -c ROM_SHA256.txt
          test "$(find evidence_600/raw -name 'frame_*.png' | wc -l)" -eq 600
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: main-iii-r1s-four-p0-x-single-hand-shot-600
          path: |
            versions.txt
            rom/v018/experiments/main_iii_r1s_reorder_arm_shot/
          if-no-files-found: ignore
