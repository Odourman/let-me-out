name: MAIN IV R1ba integrated 6 original NPC + runtime X/Y + brown PF 600 Stella
on:
  push:
    branches:
      - research/main-iv-r1ba-integrated-xyz-pf-20261116
    paths:
      - .github/workflows/main-iv-r1ba-integrated-xyz-pf-600.yml
      - rom/v018/experiments/main_iv_r1ba_combined/**
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integrated-source-exact-X-Y-PF:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install DASM Stella 6.7.1 and X11 image audit
        run: |
          sudo apt-get update
          sudo apt-get install -y dasm stella xvfb xdotool imagemagick python3-pil
          dpkg-query -W -f='${binary:Package} ${Version}\n' dasm stella | tee versions.txt
      - name: Build three X/Y positions and mirrored brown PF in one F6 ROM
        run: /usr/bin/python3 rom/v018/experiments/main_iv_r1ba_combined/build_r1ba.py
      - name: Capture 600 consecutive authentic Stella debugger frames
        timeout-minutes: 11
        run: bash rom/v018/experiments/main_iv_r1ba_combined/ci_framewalk_600.sh
      - name: Strict 6 original 8x9 masks, 3 X, 3 Y, brown PF, P0 M0, 262 NTSC
        run: /usr/bin/python3 rom/v018/experiments/main_iv_r1ba_combined/analyze_600.py
      - name: Check F6 ROM SHA256 and 600-frame evidence
        run: |
          cd rom/v018/experiments/main_iv_r1ba_combined
          test "$(stat -c %s r1ba_F6.bin)" -eq 16384
          sha256sum -c ROM_SHA256.txt
          test "$(find evidence_600/raw -name 'frame_*.png' | wc -l)" -eq 600
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: main-iv-r1ba-integrated-6-originals-X-Y-PF-600
          path: |
            versions.txt
            rom/v018/experiments/main_iv_r1ba_combined/
          if-no-files-found: ignore
