name: MAIN III R1p five NPC single arm M0 two P0 X 600 Stella
on:
  push:
    branches:
      - research/main-iii-r1p-single-shot-two-p0-modes-20261116
    paths:
      - .github/workflows/main-iii-r1p-two-x-shot-600.yml
      - rom/v018/experiments/main_iii_r1p_two_x_arm_shot/build_r1p.py
      - rom/v018/experiments/main_iii_r1p_two_x_arm_shot/analyze_600.py
      - rom/v018/experiments/main_iii_r1p_two_x_arm_shot/ci_framewalk_600.sh
  workflow_dispatch:
permissions:
  contents: read
jobs:
  r1p-two-x-shot:
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - name: Install DASM and Stella X11 debugger tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dasm stella xvfb xdotool imagemagick python3-pil
          dpkg-query -W -f='${binary:Package} ${Version}\n' dasm stella | tee versions.txt
      - name: Build two-X shot research ROM pinned to R1o SHA
        run: /usr/bin/python3 rom/v018/experiments/main_iii_r1p_two_x_arm_shot/build_r1p.py
      - name: Capture 600 consecutive authentic Stella 6.7.1 frames
        timeout-minutes: 11
        run: bash rom/v018/experiments/main_iii_r1p_two_x_arm_shot/ci_framewalk_600.sh
      - name: Fail-closed five original NPC + arm-height single M0 2x2 exact pixel audit
        run: /usr/bin/python3 rom/v018/experiments/main_iii_r1p_two_x_arm_shot/analyze_600.py
      - name: Validate exact standard 16KiB F6 and 600 PNGs
        run: |
          cd rom/v018/experiments/main_iii_r1p_two_x_arm_shot
          test "$(stat -c %s r1p_F6.bin)" -eq 16384
          sha256sum -c ROM_SHA256.txt
          test "$(find evidence_600/raw -name 'frame_*.png' | wc -l)" -eq 600
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: main-iii-r1p-single-hand-shot-two-p0-x-600
          path: |
            versions.txt
            rom/v018/experiments/main_iii_r1p_two_x_arm_shot/
          if-no-files-found: ignore
