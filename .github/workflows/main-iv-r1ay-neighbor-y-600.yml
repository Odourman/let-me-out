name: MAIN IV R1ay six original 8x9 small NPC staggered Y profiles
on:
  push:
    branches:
      - research/main-iv-r1ay-neighbor-y-six-source-masks-20261116
    paths:
      - .github/workflows/main-iv-r1ay-neighbor-y-600.yml
      - rom/v018/experiments/main_iv_r1ay_neighbor_y/**
  workflow_dispatch:
permissions:
  contents: read
jobs:
  staggered-Y-mask-profiles:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        batch: [0, 1, 2]
    env:
      R1AY_BATCH: ${{ matrix.batch }}
    steps:
      - uses: actions/checkout@v4
      - name: Install DASM Stella 6.7.1 X11 and strict screen image auditor
        run: |
          sudo apt-get update
          sudo apt-get install -y dasm stella xvfb xdotool imagemagick python3-pil
          dpkg-query -W -f='${binary:Package} ${Version}\n' dasm stella | tee versions.txt
      - name: Build source pinned six original 8x9 with static neighbor Y offsets
        run: /usr/bin/python3 rom/v018/experiments/main_iv_r1ay_neighbor_y/build_r1ay.py
      - name: Capture 600 consecutive authentic Stella images
        timeout-minutes: 11
        run: bash rom/v018/experiments/main_iv_r1ay_neighbor_y/ci_framewalk_600.sh
      - name: Strict source exact six canonical masks including expected vertical offsets
        run: /usr/bin/python3 rom/v018/experiments/main_iv_r1ay_neighbor_y/analyze_600.py
      - name: Verify 16KB F6 ROM SHA and exactly 600 screenshots
        run: |
          cd rom/v018/experiments/main_iv_r1ay_neighbor_y
          test "$(stat -c %s r1ay_F6.bin)" -eq 16384
          sha256sum -c ROM_SHA256.txt
          test "$(find evidence_600/raw -name 'frame_*.png' | wc -l)" -eq 600
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: main-iv-r1ay-y-batch-${{ matrix.batch }}-600
          path: |
            versions.txt
            rom/v018/experiments/main_iv_r1ay_neighbor_y/
          if-no-files-found: ignore
