name: MAIN IV R1ah three complete original P1 masks Stella
on:
  push:
    branches:
      - research/main-iv-r1ah-three-full-original-p1-20261116
    paths:
      - .github/workflows/main-iv-r1ah-three-p1-600.yml
      - rom/v018/experiments/main_iv_r1ah_three_p1/**
  workflow_dispatch:
permissions:
  contents: read
jobs:
  third-mask:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        batch: [0, 1, 2, 3]
    env:
      R1AH_BATCH: ${{ matrix.batch }}
    steps:
      - uses: actions/checkout@v4
      - name: Install DASM Stella and X11
        run: |
          sudo apt-get update
          sudo apt-get install -y dasm stella xvfb xdotool imagemagick python3-pil
          dpkg-query -W -f='${binary:Package} ${Version}\n' dasm stella | tee versions.txt
      - name: Build exact 3 original canonical mask experiment
        run: /usr/bin/python3 rom/v018/experiments/main_iv_r1ah_three_p1/build_r1ah.py
      - name: Capture 600 real Stella frames
        timeout-minutes: 11
        run: bash rom/v018/experiments/main_iv_r1ah_three_p1/ci_framewalk_600.sh
      - name: Strict full 3-mask and yellow P0 M0 pixel test
        run: /usr/bin/python3 rom/v018/experiments/main_iv_r1ah_three_p1/analyze_600.py
      - name: Validate ROM size SHA and PNG count
        run: |
          cd rom/v018/experiments/main_iv_r1ah_three_p1
          test "$(stat -c %s r1ah_F6.bin)" -eq 16384
          sha256sum -c ROM_SHA256.txt
          test "$(find evidence_600/raw -name 'frame_*.png' | wc -l)" -eq 600
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: main-iv-r1ah-batch-${{ matrix.batch }}-three-P1-600
          path: |
            versions.txt
            rom/v018/experiments/main_iv_r1ah_three_p1/
          if-no-files-found: ignore
