name: MAIN II R1b close-spacing 57cc exact masks
on:
  push:
    branches:
      - research/main-ii-r1b-near57-20261116
    paths:
      - .github/workflows/main-ii-r1b-near57.yml
      - rom/v018/experiments/main_ii_near/**
  workflow_dispatch:
permissions:
  contents: read
jobs:
  near:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install DASM Stella and capture dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dasm stella xvfb imagemagick python3-pil
          dpkg-query -W -f='${binary:Package} ${Version}\n' dasm stella | tee versions.txt
      - name: Build one independent 16KB F6 original-mask variant
        run: /usr/bin/python3 rom/v018/experiments/main_ii_near/build_variants.py
      - name: Capture 4 frames and three actual PC stops
        timeout-minutes: 8
        run: bash rom/v018/experiments/main_ii_near/ci_near_captures.sh
      - name: Exact original masks P0 M0 and independent-X pixels at 57 CC
        run: /usr/bin/python3 rom/v018/experiments/main_ii_near/near57/pixel_audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: main-ii-r1b-near57-stella-evidence
          path: |
            versions.txt
            rom/v018/experiments/main_ii_near/
          if-no-files-found: ignore
